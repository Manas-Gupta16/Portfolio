name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build with Astro
        run: npx astro build
        env:
          PUBLIC_FIREBASE_API_KEY: placeholder
          PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder
          PUBLIC_FIREBASE_PROJECT_ID: placeholder
          PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: placeholder
          PUBLIC_FIREBASE_APP_ID: placeholder

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
